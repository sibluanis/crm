<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM SYSTEM</title>
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d11; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #0b0d11; color: #f3f1ea; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; transition: opacity .3s; }
  #splash img { width: 84px; height: 84px; border-radius: 20px; }
  #splash .bar { width: 140px; height: 4px; border-radius: 4px; background: #242938; overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #c9a13b; animation: run 1.1s ease-in-out infinite; }
  #splash small { color: #9aa0ad; max-width: 320px; }
  @keyframes run { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  #splash.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><div class="bar"><i></i></div><small id="msg">Opening the CRM…</small></div>
<script>
  // ===== Put your web app link here (Apps Script > Deploy > Manage deployments > Web app URL, ends with /exec) =====
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz5MBK8a9ALRK15DVTnAtfEsLfy9hRA0ox7xfnpKsc7-sDQQ4zaRJzMfR22fjdWS8EJUw/exec';
  // ==================================================================================================================

  var msg = document.getElementById('msg'), splash = document.getElementById('splash');
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
    msg.textContent = 'Setup: open index.html on GitHub and paste the web app link (ending with /exec) into APP_URL.';
  } else if (!navigator.onLine) {
    msg.textContent = 'No internet connection. Connect and open the app again.';
    window.addEventListener('online', function () { location.reload(); });
  } else {
    var f = document.createElement('iframe');
    f.id = 'app';
    f.title = 'CRM';
    f.src = APP_URL;
    f.allow = 'geolocation *; clipboard-read *; clipboard-write *; camera *; microphone *; fullscreen *';
    f.onload = function () { splash.className = 'gone'; };
    document.body.insertBefore(f, splash);
    setTimeout(function () { splash.className = 'gone'; }, 12000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
